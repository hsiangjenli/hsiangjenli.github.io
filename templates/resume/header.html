<section id="header"><header><h1 id="logo"><a href="{{ asset_prefix }}">{{ site.name }} <small>{{ site.nickname }}</small></a></h1><p class="medium"><em>{{ ui.quote }}</em></p></header>
  <nav id="nav"><ul><li><a href="#intro">{{ ui.nav_about }}</a></li><li><a href="#education">{{ ui.nav_education }}</a></li><li><a href="#experience">{{ ui.nav_experience }}</a></li><li><a href="#awards">{{ ui.nav_awards }}</a></li><li><a href="#skills">{{ ui.nav_skills }}</a></li><li><a href="#interest">{{ ui.nav_interest }}</a></li></ul></nav>
  <footer><ul class="icons"><li><a href="https://github.com/{{ author.github }}" class="fa-brands fa-github"><span class="label">GitHub</span></a></li><li><a href="https://www.linkedin.com/in/{{ author.linkedin }}" class="fa-brands fa-linkedin"><span class="label">LinkedIn</span></a></li><li><a href="mailto:{{ author.email }}" class="fa-solid fa-envelope"><span class="label">Email</span></a></li><li><a class="locale-link" href="{{ alternate_url }}">{{ ui.switch_locale }}</a></li></ul></footer></section>
