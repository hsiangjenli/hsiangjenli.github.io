[project]
name = "hsiangjenli-github-io"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "jinja2>=3.1.6",
    "pydantic>=2.12.3",
    "requests>=2.32.5",
    "toml>=0.10.2",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "sitegen"]

[tool.pytest.ini_options]
pythonpath = ["."]
